name: Build All Packages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'   # 每周日 UTC 02:00 = 北京时间周一 10:00
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - luci-app-adguardhome
          - luci-app-advancedplus
          - luci-app-chatgpt-web
          - luci-app-eqosplus
          - luci-app-kucat-config
          - luci-app-momo
          - luci-app-netdata
          - luci-app-netwizard
          - luci-app-openclash
          - luci-app-ota
          - luci-app-passwall
          - luci-app-passwall2
          - luci-app-poweroffdevice
          - luci-app-tailscale
          - luci-app-taskplan
          - luci-app-timecontrol
          - luci-app-wechatpush
          - luci-app-wolplus
          - luci-app-wrtbwmon
          - luci-app-znetcontrol
          - lucky
          - momo
          - nikki
          - netspeedtest
          - watchdog
          - wrtbwmon
          - bandix
          - easytier
        sdk: [openwrt-24.10, openwrt-25.12]
    steps:
      - uses: actions/checkout@v4

      - name: Check package exists
        id: check
        run: |
          if [ -d "${{ matrix.package }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - uses: sbwml/openwrt-gh-action-sdk@main
        if: steps.check.outputs.exists == 'true'
        env:
          ARCH: x86_64-${{ matrix.sdk }}
          FEEDNAME: zuoxm
          PACKAGES: ${{ matrix.package }}

      - name: Upload build artifacts
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.sdk }}-${{ matrix.package }}
          # openwrt-24.10 出 .ipk；openwrt-25.12 (iStore/immortalwrt) 出 .apk。
          # 用宽通配 *${{ matrix.package }}* 同时收两种格式，避免漏掉 apk。
          path: |
            bin/packages/x86_64/zuoxm/*${{ matrix.package }}*.ipk
            bin/packages/x86_64/zuoxm/*${{ matrix.package }}*.apk
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ipks
          pattern: ipk-*
          merge-multiple: true

      - name: Check for compiled packages
        id: check
        run: |
          # ipk + apk 都算产物
          count=$( (ls ipks/*.ipk 2>/dev/null; ls ipks/*.apk 2>/dev/null) | wc -l )
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Packages found: $count"
          if [ "$count" -eq 0 ]; then
            echo "No packages compiled, skipping release"
          else
            echo "Compiled packages:"
            ls ipks/*.ipk ipks/*.apk 2>/dev/null
          fi

      - name: Generate release tag
        if: steps.check.outputs.count != '0'
        id: ver
        run: |
          DATE=$(date +%Y%m%d)
          TIME=$(date +%H%M)
          echo "tag=all-${DATE}-${TIME}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 插件包汇总 ${{ steps.ver.outputs.tag }}
          body: |
            佐罗 ImmortalWrt 插件包汇总

            **编译日期**: ${{ steps.ver.outputs.date }}
            **架构**: x86_64
            **编译SDK**: openwrt-24.10 (.ipk) / openwrt-25.12 (.apk)

            安装方法：
            - OpenWrt/ImmortalWrt(opkg)：`opkg install <包名>.ipk`
            - iStore 设备(apk)：`apk add <包名>.apk`

            共 ${{ steps.check.outputs.count }} 个包：
            ```
            $(ls ipks/*.ipk ipks/*.apk 2>/dev/null | xargs -n1 basename | sort)
            ```
          files: ipks/*.ipk ipks/*.apk
          make_latest: true
