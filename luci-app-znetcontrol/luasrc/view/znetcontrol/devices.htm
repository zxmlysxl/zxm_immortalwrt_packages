<%+header%>
<%- local znc = require("luci.model.znetcontrol.theme") -%>
<%-
local znc_default = znc.css_default()
local znc_apply = znc.js_bundle()
-%>
<style id="znetcontrol-theme-default">
<%= znc_default %>
</style>
<script>
<%= znc_apply %>
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', znetcontrolApplyTheme);
} else {
  znetcontrolApplyTheme();
}
</script>


<div class="cbi-map">
    <h2 name="content"><%:在线设备%></h2>
    <div class="cbi-map-descr">
        <%:当前网络中的在线设备列表%>
        <br><span style="color: var(--znc-primary-text);"><i class="icon icon-info"></i> <%:提示：可以快速将设备添加到管控规则中%></span>
    </div>
    
    <div class="table cbi-section-table" id="device-table">
        <div class="tr table-titles">
            <div class="th" style="width: 15%;"><%:IP地址%></div>
            <div class="th" style="width: 21%;"><%:IPv6地址%></div>
            <div class="th" style="width: 19%;"><%:MAC地址%></div>
            <div class="th" style="width: 14%;"><%:主机名%></div>
            <div class="th" style="width: 30%;"><%:状态%></div>
        </div>
        <div id="device-list">
            <div class="tr placeholder">
                <div class="td" colspan="5" style="text-align: center; padding: 30px;">
                    <div class="loading-spinner"></div>
                    <p style="color: var(--znc-secondary-text); margin-top: 10px;"><%:正在加载设备列表...%></p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="cbi-page-actions" style="margin-top: 20px;">
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="cbi-button cbi-button-action" onclick="refreshDevices()">
                <i class="icon icon-refresh"></i> <%:刷新列表%>
            </button>
            <button class="cbi-button cbi-button-apply" onclick="window.location.href='<%=luci.dispatcher.build_url("admin/control/znetcontrol/rules")%>'">
                <i class="icon icon-settings"></i> <%:管理规则%>
            </button>
            <button class="cbi-button" onclick="closeWindow()">
                <i class="icon icon-close"></i> <%:关闭%>
            </button>
        </div>
    </div>
</div>

<script>
// 转义函数
function escapeForJs(str) {
    if (!str) return '';
    return String(str)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, '\\n')
        .replace(/\r/g, '')
        .replace(/\t/g, '\\t')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

// 主题检测/应用已由 znc theme module 提供（znetcontrolDetectMode / znetcontrolApplyTheme）

function refreshDevices() {
    const deviceList = document.getElementById('device-list');
    
    deviceList.innerHTML = '<div class="tr placeholder"><div class="td" colspan="5" style="text-align: center; padding: 30px;"><div class="loading-spinner"></div><p style="margin-top: 10px;"><%:正在加载设备列表...%></p></div></div>';
    
    fetch('<%=luci.dispatcher.build_url("admin/control/znetcontrol/api/get_devices")%>')
        .then(response => response.json())
        .then(devices => {
            let html = '';
            
            if (!devices || devices.length === 0) {
                html = '<div class="tr">' +
                       '<div class="td" colspan="5" style="text-align: center; padding: 40px;">' +
                       '<div class="empty-state">' +
                       '<i class="icon icon-devices" style="font-size: 48px; margin-bottom: 10px;"></i>' +
                       '<p style="margin: 0 0 10px 0;"><%:未找到在线设备%></p>' +
                       '<p style="font-size: 12px;">请确认有设备连接到网络</p>' +
                       '</div>' +
                       '</div>' +
                       '</div>';
            } else {
                devices.forEach(device => {
                    // 兼容老字段缺失：新字段（online/ipv6/sources）一律做兜底
                    const isConfigured = !!device.is_configured;
                    const mac = device.mac || '';
                    const ip = device.ip || '';
                    const targetType = mac ? 'mac' : 'ip';
                    const targetValue = mac || ip;
                    const hostname = device.hostname || '';
                    const online = (device.online === undefined) ? true : !!device.online;
                    const ipv6 = Array.isArray(device.ipv6) ? device.ipv6 : [];
                    const sources = Array.isArray(device.sources) ? device.sources : [];
                    const isBlacklisted = !!device.is_blacklisted;
                    const blLabel = device.blacklist_label || '';

                    const safeTarget = escapeForJs(targetValue);
                    const safeHostname = escapeForJs(hostname);

                    html += '<div class="tr device-row' + (online ? '' : ' device-offline') + '">';

                    // IP地址列（IPv4；纯 IPv6 设备标注）
                    html += '<div class="td ip-address-cell">' +
                           '<div class="ip-address-box">' +
                           '<span class="ip-address-text">' +
                           (ip ? escapeForJs(ip) : (ipv6.length ? 'IPv6-only' : '未知')) +
                           '</span>' +
                           '</div>' +
                           '</div>';

                    // IPv6 地址列
                    html += '<div class="td ipv6-address-cell">';
                    if (ipv6.length) {
                        html += '<div class="ipv6-list">' +
                                ipv6.map(a => '<span class="ipv6-item">' + escapeForJs(a) + '</span>').join('') +
                                '</div>';
                    } else {
                        html += '<span class="ipv6-none">—</span>';
                    }
                    if (sources.length) {
                        html += '<div class="device-sources">来源：' + escapeForJs(sources.join('/')) + '</div>';
                    }
                    html += '</div>';

                    // MAC地址列
                    html += '<div class="td mac-address-cell">' +
                           '<div class="mac-address-box">' +
                           '<span class="mac-address-text">' + escapeForJs(mac) + '</span>' +
                           '</div>' +
                           '</div>';

                    // 主机名列
                    html += '<div class="td hostname-cell">' +
                           '<div class="device-hostname">' +
                           (hostname ? escapeForJs(hostname) : '<span>未知设备</span>') +
                           '</div>' +
                           '</div>';

                    // 状态列：在线/离线 + 是否已配规则
                    html += '<div class="td status-cell">' +
                           '<div class="device-status">';
                    html += '<div class="status-online ' + (online ? 'on' : 'off') + '">' +
                           (online ? '在线' : '离线') + '</div>';

                    if (isConfigured) {
                        html += '<div class="status-container configured">' +
                               '<div class="status-icon">' +
                               '<i class="icon icon-check-circle"></i>' +
                               '</div>' +
                               '<div class="status-content">' +
                               '<div class="status-title">已添加管控</div>' +
                               '<div class="status-action" onclick="goToRules()">点击管理规则</div>' +
                               '</div>' +
                               '</div>';
                    } else {
                        html += '<div class="status-container not-configured">' +
                               '<button class="add-rule-btn" onclick="addToRules(\'' + targetType + '\', \'' + safeTarget + '\', \'' + safeHostname + '\')">' +
                               '<i class="icon icon-plus-circle"></i> 添加管控规则' +
                               '</button>' +
                               '</div>';
                    }

                    // 黑名单状态：已加入则显示状态，未加入给按钮
                    if (isBlacklisted) {
                        html += '<div class="status-container bl-configured">' +
                               '<div class="status-icon">' +
                               '<i class="icon icon-block"></i>' +
                               '</div>' +
                               '<div class="status-content">' +
                               '<div class="status-title bl-title">已加入黑名单</div>' +
                               (blLabel ? '<div class="bl-label">' + escapeForJs(blLabel) + '</div>' : '') +
                               '<div class="status-action" onclick="goToBlacklist()">点击管理黑名单</div>' +
                               '</div>' +
                               '</div>';
                    } else {
                        html += '<div class="status-container bl-not-configured">' +
                               '<button class="add-bl-btn" onclick="addToBlacklist(\'' + targetType + '\', \'' + safeTarget + '\', \'' + safeHostname + '\')">' +
                               '<i class="icon icon-block"></i> 加入黑名单' +
                               '</button>' +
                               '</div>';
                    }

                    html += '</div></div></div>';
                });
            }
            
            deviceList.innerHTML = html;
            znetcontrolApplyTheme();
        })
        .catch(error => {
            console.error('获取设备列表失败:', error);
            deviceList.innerHTML = '<div class="tr">' +
                '<div class="td" colspan="5" style="text-align: center; padding: 40px;">' +
                '<div class="error-state">' +
                '<i class="icon icon-alert-circle" style="font-size: 48px; color: var(--znc-danger-text); margin-bottom: 10px;"></i>' +
                '<p style="color: var(--znc-danger-text); margin: 0 0 10px 0;"><%:加载失败%></p>' +
                '<p style="font-size: 12px; margin-bottom: 15px;">错误: ' + error.message + '</p>' +
                '<button class="cbi-button cbi-button-action" onclick="refreshDevices()" style="padding: 8px 16px;">' +
                '<i class="icon icon-refresh"></i> 重试' +
                '</button>' +
                '</div>' +
                '</div>' +
                '</div>';
            
            znetcontrolApplyTheme();
        });
}

// 其他函数保持原样
function addToRules(type, target, hostname) {
    // 调试日志 - 修复按钮点击无响应问题
    console.log('[znetcontrol] 点击添加规则:', {
        type: type,
        target: target,
        hostname: hostname,
        timestamp: new Date().toISOString()
    });
    
    if (!target || target === '未知') {
        showToast('无法添加，目标地址无效', 'error');
        return;
    }
    
    hostname = (hostname || '').trim().replace(/\n/g, '');
    target = (target || '').trim().replace(/\n/g, '');
    
    const invalidHostnames = ['未知', '未知设备', 'unknown', '*', ''];
    const isHostnameValid = hostname && !invalidHostnames.includes(hostname) && hostname !== target;
    
    let ruleName = '';
    if (isHostnameValid) {
        ruleName = hostname.replace(/\.lan$/i, '')
                          .replace(/\.local$/i, '')
                          .replace(/\.home$/i, '')
                          .replace(/\n/g, '')
                          .trim();
    } else {
        if (type === 'mac') {
            const macClean = target.replace(/:/g, '').replace(/-/g, '').toUpperCase();
            ruleName = '设备_' + (macClean.substring(macClean.length - 6) || '未知');
        } else {
            ruleName = 'IP_' + target.replace(/\./g, '_');
        }
    }
    
    const confirmDialog = document.createElement('div');
    confirmDialog.className = 'confirm-dialog-overlay';
    confirmDialog.innerHTML = `
        <div class="confirm-dialog">
            <div class="dialog-header">
                <i class="icon icon-shield" style="font-size: 24px; color: var(--znc-primary-text);"></i>
                <h3 style="margin: 10px 0 5px 0;">添加管控规则</h3>
            </div>
            <div class="dialog-body">
                <p>是否添加以下管控规则？</p>
                <div class="device-info-card">
                    <div><strong>目标地址:</strong> <code>${target}</code></div>
                    <div><strong>类型:</strong> ${type === 'mac' ? 'MAC地址' : 'IP地址'}</div>
                    <div><strong>规则名称:</strong> ${ruleName}</div>
                </div>
            </div>
            <div class="dialog-actions">
                <button class="cbi-button cancel-btn">取消</button>
                <button class="cbi-button cbi-button-action confirm-btn" 
                        data-type="${type}" 
                        data-target="${target}" 
                        data-rulename="${ruleName}">确定添加</button>
            </div>
        </div>
    `;
    document.body.appendChild(confirmDialog);
    
    setTimeout(() => {
        const dialog = document.querySelector('.confirm-dialog-overlay');
        if (dialog) {
            dialog.querySelector('.cancel-btn').addEventListener('click', () => dialog.remove());
            dialog.querySelector('.confirm-btn').addEventListener('click', function() {
                const type = this.getAttribute('data-type');
                const target = this.getAttribute('data-target');
                const ruleName = this.getAttribute('data-rulename');
                dialog.remove();
                confirmAddRule(type, target, ruleName);
            });
        }
    }, 10);
}

function confirmAddRule(type, target, ruleName) {
    const dialog = document.querySelector('.confirm-dialog-overlay');
    if (dialog) dialog.remove();
    
    showToast('正在添加规则...', 'info');
    
    const formData = new FormData();
    formData.append('target', target.trim());
    formData.append('type', type);
    formData.append('name', ruleName.trim());
    
    fetch('<%=luci.dispatcher.build_url("admin/control/znetcontrol/api/quick_add")%>', {
        method: 'POST',
        body: formData
    })
    .then(response => response.text())
    .then(text => {
        let result;
        try { result = JSON.parse(text); } catch { throw new Error('响应格式错误'); }
        
        if (result.success) {
            showToast('规则添加成功，正在跳转到管控规则页面...', 'success');
            setTimeout(() => window.location.href = '<%=luci.dispatcher.build_url("admin/control/znetcontrol/rules")%>', 2000);
        } else {
            showToast('添加失败: ' + (result.message || '未知错误'), 'error');
        }
    })
    .catch(error => {
        console.error('添加规则失败:', error);
        showToast('添加失败: ' + error.message, 'error');
    });
}

function goToRules() {
    window.location.href = '<%=luci.dispatcher.build_url("admin/control/znetcontrol/rules")%>';
}

function goToBlacklist() {
    window.location.href = '<%=luci.dispatcher.build_url("admin/control/znetcontrol/blacklist")%>';
}

// 加入黑名单：确认后调用后端 API
function addToBlacklist(type, target, hostname) {
    if (!target || target === '未知') {
        showToast('无法加入，目标地址无效', 'error');
        return;
    }
    const t = String(target).trim();
    const h = String(hostname || '').trim();

    const overlay = document.createElement('div');
    overlay.className = 'confirm-dialog-overlay';
    overlay.innerHTML = `
        <div class="confirm-dialog">
            <div class="dialog-header">
                <i class="icon icon-block" style="font-size: 24px; color: var(--znc-danger-text);"></i>
                <h3 style="margin: 10px 0 5px 0;">加入黑名单</h3>
            </div>
            <div class="dialog-body">
                <p>加入后该设备将<b>立即无法上网</b>（全天 24 小时生效）。</p>
                <div class="device-info-card">
                    <div><strong>目标地址:</strong> <code>${escapeForJs(t)}</code></div>
                    <div><strong>类型:</strong> ${type === 'mac' ? 'MAC地址' : 'IP地址'}</div>
                </div>
            </div>
            <div class="dialog-actions">
                <button class="cbi-button cancel-btn">取消</button>
                <button class="cbi-button cbi-button-apply confirm-btn">确定加入</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);

    setTimeout(() => {
        const dlg = document.querySelector('.confirm-dialog-overlay');
        if (!dlg) return;
        dlg.querySelector('.cancel-btn').addEventListener('click', () => dlg.remove());
        dlg.querySelector('.confirm-btn').addEventListener('click', () => {
            dlg.remove();
            submitBlacklist(t, type, h);
        });
    }, 10);
}

function submitBlacklist(target, type, hostname) {
    showToast('正在加入黑名单...', 'info');
    const fd = new FormData();
    fd.append('target', target);
    fd.append('type', type);
    fd.append('name', hostname || '');

    fetch('<%=luci.dispatcher.build_url("admin/control/znetcontrol/api/blacklist_add")%>', {
        method: 'POST',
        body: fd
    })
    .then(r => r.text())
    .then(text => {
        let res;
        try { res = JSON.parse(text); } catch (e) { throw new Error('响应格式错误'); }
        if (res.success) {
            showToast(res.message || '已加入黑名单', 'success');
            setTimeout(refreshDevices, 800);
        } else {
            showToast('加入失败: ' + (res.message || '未知错误'), 'error');
        }
    })
    .catch(err => {
        console.error('加入黑名单失败:', err);
        showToast('加入失败: ' + err.message, 'error');
    });
}

function showToast(message, type = 'info') {
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `<div class="toast-content"><i class="icon icon-${type === 'success' ? 'check-circle' : type === 'error' ? 'alert-circle' : 'info'}"></i><span>${message}</span></div>`;
    document.body.appendChild(toast);
    
    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function closeWindow() {
    if (window.opener && !window.opener.closed) {
        window.close();
    } else {
        window.history.back();
    }
}

    .status-action {
        font-size: 12px;
        color: var(--znc-secondary-text);
        cursor: pointer;
        transition: color 0.2s;
        margin-top: 2px;
        white-space: nowrap;
    }

    .status-action:hover {
        color: var(--znc-success-text);
        text-decoration: underline;
    }
    
    /* 添加按钮样式 */
    .add-rule-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.3s ease;
        box-shadow: 0 2px 4px rgba(102, 126, 234, 0.3);
        white-space: nowrap;
    }
    
    .add-rule-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
    }

    /* 已加入黑名单 */
    .bl-configured {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px dashed var(--znc-border);
    }

    .bl-configured .status-icon {
        background: var(--znc-danger-bg);
        color: var(--znc-danger-text);
    }

    .bl-title {
        color: var(--znc-danger-text) !important;
    }

    .bl-label {
        font-size: 12px;
        color: var(--znc-secondary-text);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 加入黑名单按钮 */
    .bl-not-configured {
        margin-top: 6px;
        padding-top: 6px;
        border-top: 1px dashed var(--znc-border);
    }

    .add-bl-btn {
        background: linear-gradient(135deg, #e55353 0%, #b02a37 100%);
        color: #fff;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 12.5px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: all 0.3s ease;
        box-shadow: 0 2px 4px rgba(176, 42, 55, 0.28);
        white-space: nowrap;
    }

    .add-bl-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 8px rgba(176, 42, 55, 0.4);
    }
    
    /* 加载动画 */
    .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--znc-border);
        border-top: 3px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
    }
    
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
    
    /* 空状态和错误状态 */
    .empty-state,
    .error-state {
        padding: 20px;
    }
    
    .empty-state p,
    .error-state p {
        color: var(--znc-secondary-text);
    }
    
    .empty-state i,
    .error-state i {
        font-size: 48px;
        margin-bottom: 10px;
    }
    
    /* 响应式设计 */
    @media (max-width: 768px) {
        .tr {
            flex-direction: column;
            padding: 15px;
            border-bottom-width: 2px;
            align-items: flex-start;
        }
        
        .th {
            display: none;
        }
        
        .td {
            width: 100% !important;
            padding: 10px 0;
            border: none;
            flex-direction: column;
            align-items: flex-start;
        }
        
        .ip-address-box,
        .mac-address-box {
            width: 100% !important;
            text-align: left;
            margin: 5px 0;
        }
        
        .td:before {
            content: attr(data-label);
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: inherit;
        }
        
        .ip-address-cell:before { content: "IP地址:"; }
        .ipv6-address-cell:before { content: "IPv6地址:"; }
        .mac-address-cell:before { content: "MAC地址:"; }
        .hostname-cell:before { content: "主机名:"; }
        .status-cell:before { content: "管控状态:"; }
    }
    
    /* 按钮组样式 */
    .cbi-page-actions .cbi-button {
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: 500;
        transition: all 0.3s ease;
        color: white;
    }
    
    .cbi-button-action {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
    }
    
    .cbi-button-apply {
        background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
        border: none;
    }
    
    .cbi-button {
        background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        border: none;
    }
    
    .cbi-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    /* 弹窗样式 */
    .confirm-dialog-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
    }
    .confirm-dialog {
        background: var(--znc-card-bg);
        border-radius: 8px;
        max-width: 420px;
        width: 90%;
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        overflow: hidden;
    }
    .dialog-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .dialog-header h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .dialog-body { padding: 20px; color: var(--znc-primary-text); }
    .dialog-body p { margin: 0 0 15px 0; }
    .device-info-card {
        background: var(--znc-box-bg);
        border-radius: 6px;
        padding: 12px 16px;
        font-size: 14px;
        line-height: 1.8;
    }
    .device-info-card code {
        background: var(--znc-code-bg);
        padding: 2px 6px;
        border-radius: 3px;
        font-family: Consolas, monospace;
    }
    .dialog-actions {
        padding: 12px 20px 20px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
    }
    .dialog-actions .cbi-button {
        padding: 8px 20px;
        border-radius: 6px;
        border: none;
        font-size: 14px;
        cursor: pointer;
    }
    .dialog-actions .cancel-btn {
        background: var(--znc-box-bg);
        color: var(--znc-primary-text);
    }
    .dialog-actions .confirm-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
    }

    /* Toast 提示样式 */
    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        z-index: 999999;
        transition: transform 0.3s ease;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast-content {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(0,0,0,0.8);
        color: #fff;
        padding: 10px 20px;
        border-radius: 6px;
        font-size: 14px;
        white-space: nowrap;
    }
`;

document.head.appendChild(style);

// 页面加载
window.onload = function() {
    znetcontrolApplyTheme();
    refreshDevices();

    // 系统配色变化监听
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener) {
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', znetcontrolApplyTheme);
    }
    const obs = new MutationObserver(znetcontrolApplyTheme);
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['data-mode'] });
};
</script>
<%+footer%>
